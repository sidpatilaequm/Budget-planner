services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: budget_planner
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app_internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@budget-planner-db-1:3306/budget_planner?charset=utf8mb4"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_HOURS: ${JWT_HOURS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://budget.nexdaequmsupport.com}
    depends_on:
      db:
        condition: service_healthy
    networks:
      app_internal:
      proxy:
        aliases:
          - budget-planner-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      proxy:
        aliases:
          - budget-planner-frontend

networks:
  app_internal:
    internal: true
  proxy:
    external: true
    name: projectsystem_default

volumes:
  mysql_data:
